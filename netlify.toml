# Netlify deploys the pre-built static site in site/ (data files come from export_site.py).
# base = "site" also stops Netlify from pip-installing requirements.txt, which the website doesn't need.
[build]
  base = "site"
  publish = "."

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
